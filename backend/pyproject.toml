[project]
name = "finance-tracker-backend"
version = "0.1.0"
description = "Local FastAPI backend for household finance tracking"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "cryptography>=43.0.0",
    "plaid-python>=28.0.0",
    "rapidfuzz>=3.10.0",
    "scikit-learn>=1.5.0",
    "python-multipart>=0.0.12",
    "apscheduler>=3.10.4",
    "joblib>=1.4.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "httpx>=0.27.0"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
