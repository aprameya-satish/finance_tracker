services:
  - type: web
    name: finance-tracker-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: https://aprameya-satish.github.io,http://localhost:5173,http://127.0.0.1:5173
      - key: PLAID_ENV
        value: sandbox
      - key: PLAID_PRODUCTS
        value: transactions
      - key: PLAID_REDIRECT_URI
        value: https://aprameya-satish.github.io/finance_tracker/accounts
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_TOKEN_KEY
        sync: false
      - key: API_SHARED_SECRET
        sync: false
